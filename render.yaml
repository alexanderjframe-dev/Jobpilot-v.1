# Render Blueprint: private, persistent single-user JobPilot deployment.
# PAID Render instance + disk required for durable resume / application data.
services:
  - type: web
    name: jobpilot-mobile
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: JOBPILOT_HOSTED
        value: "1"
      - key: JOBPILOT_ACCESS_PASSWORD
        sync: false
      - key: JOBPILOT_DATA_DIR
        value: /var/data
    disk:
      name: jobpilot-storage
      mountPath: /var/data
      sizeGB: 1
